name: Deploy Remaarkly Production

on:
  push:
    branches:
      - main

concurrency:
  group: remaarkly-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd /var/www/remaarkly

            echo "=== Updating repository ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Building application ==="
            npm run build

            echo "=== Fixing ownership ==="
            chown -R deploy:deploy /var/www/remaarkly

            echo "=== Restarting service ==="
            systemctl restart remaarkly.service

            echo "=== Checking service ==="
            systemctl is-active --quiet remaarkly.service

            echo "=== Checking application ==="
            sleep 3
            curl -f http://127.0.0.1:3005

            echo "=== Remaarkly deployment successful ==="